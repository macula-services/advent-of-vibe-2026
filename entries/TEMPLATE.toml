# One file per run. Copy this file to entries/<your-handle>-<language>.toml,
# fill it in, and open a pull request that adds only that file and the redrawn
# DATASHEET.csv and TABLE.md. RULES.md says what each column means.
# Ran the same formula again? Add a second file: every run is a row.

handle = "your-github-handle"
repo = "https://github.com/you/your-bookclub"   # public, and yours to control
commit = "0000000000000000000000000000000000000000"   # the commit every number below is about
entered = 2026-12-01
licence = "Apache-2.0"   # any licence, or "none"
run_with = "docker compose up"   # the one command that starts the club and its observer

[build]
language = "Rust"
frameworks = "axum, tokio"
harness = "OpenCode"
models = ["DeepSeek v4"]
provider = "DeepSeek"   # who served the models: the vendor, a reseller, or "self" for your own machine
addons = []   # MCP servers, skills, rules files, templates, plugins; [] for none

[services]
event_store = "an event log of my own, in sqlite"   # what keeps the event log
read_model_store = "sqlite"                         # what keeps the read models
fact_carrier = "NATS"                               # what carries the three facts to the observer
other_services = []                                 # anything else that must run; [] for none

[environment]
runs_on = "hosted"   # where the models ran: hosted | local | both
hardware = "laptop, 8 cores, 32 GB"   # the machine the work ran on; for a local model, its GPU too

[cost]
usd = 0.00              # everything the agent consumed, first prompt to the entered commit
basis = "billed"        # billed | list-price | local
tokens = 0              # input plus output, all models
agent_minutes = 0       # wall-clock time the agent worked
human_turns = 0         # messages you typed to the agent
hand_written_lines = 0  # lines of the entered commit that a person typed
attempts = 1            # how many times you started over, this one included

[result]
desks = 0               # what check_bookclub.py printed: 0 to 27
rebuilds = false        # what it printed for "rebuilds from the log"
suite = "1.0.0"         # check_bookclub.py --version
stranger = "pass"       # what stranger_test.py printed: pass | fail
evidence = "vibe/"      # folder in your repo with the witness and the cost evidence
notes = ""
