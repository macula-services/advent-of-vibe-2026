# One of the three clubs the measurement started from. Built before the rules
# existed, so the cost is what its author remembers and the protocol numbers
# were never recorded.
reference = true
handle = "macula-services"
repo = "https://github.com/macula-services/mcl-bookclub-phoenix"
commit = "a8c126d24580d8c4d88b75902e57b2e6cc4908ea"
entered = 2026-11-14
licence = "Apache-2.0"

[build]
language = "Elixir"
frameworks = "Phoenix LiveView, evoq"
harness = "OpenCode"
models = ["DeepSeek v4"]

[services]
event_store = "reckon_db"
read_model_store = "sqlite"
fact_carrier = "Macula mesh"
other_services = []

[environment]
runs_on = "hosted"

[cost]
usd = 5
approximate = true
basis = "billed"

[result]
stranger = "pass"
notes = "Not run: this club has a LiveView page and no JSON API."
