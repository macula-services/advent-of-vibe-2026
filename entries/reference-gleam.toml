# One of the three clubs the measurement started from. Built before the rules
# existed, so the cost is what its author remembers and the protocol numbers
# were never recorded.
reference = true
handle = "macula-services"
repo = "https://github.com/macula-services/mcl-bookclub-gleam"
commit = "a9f53531971f400e769472940f9425e2efae2af3"
entered = 2026-11-14
licence = "Apache-2.0"

[build]
language = "Gleam"
frameworks = "OTP 28, evoq, cowboy"
harness = "OpenCode"
models = ["DeepSeek v4"]

[services]
event_store = "reckon_db"
read_model_store = "sqlite"
fact_carrier = "Macula mesh"
other_services = []

[environment]
runs_on = "hosted"

[cost]
usd = 17
approximate = true
basis = "billed"

[result]
stranger = "pass"
notes = "Not run."
