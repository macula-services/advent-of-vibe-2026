# Everything in check.sh, on every pull request and on main: the lint floor
# (ruff, complexity, nesting, format), the three tools' own tests, and the
# table against the entries.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tools need Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - name: Check
        run: ./check.sh
